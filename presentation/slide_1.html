<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #EAEFEA; font-family: 'Helvetica Neue', Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
      .slide-container {
          width: 1280px;
          min-height: 720px;
          background: #F4F7F5;
          position: relative;
          overflow: hidden;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          padding: 80px;
      }
      .shape-1 {
          position: absolute;
          top: -100px;
          right: -100px;
          width: 500px;
          height: 500px;
          background: rgba(26, 60, 52, 0.08);
          border-radius: 50%;
      }
      .shape-2 {
          position: absolute;
          bottom: -150px;
          left: -100px;
          width: 600px;
          height: 600px;
          background: rgba(217, 108, 6, 0.06);
          border-radius: 40%;
          transform: rotate(45deg);
      }
      .header {
          z-index: 2;
      }
      .badge {
          display: inline-block;
          background: #D96C06;
          color: white;
          padding: 8px 16px;
          font-size: 14px;
          font-weight: 700;
          letter-spacing: 1.5px;
          text-transform: uppercase;
          margin-bottom: 24px;
      }
      h1 {
          font-family: 'Georgia', serif;
          font-size: 56px;
          color: #1A3C34;
          font-weight: 700;
          line-height: 1.15;
          margin-bottom: 20px;
      }
      .subtitle {
          font-size: 24px;
          color: #3E504B;
          font-weight: 300;
          max-width: 800px;
          line-height: 1.4;
      }
      .footer-info {
          z-index: 2;
          display: flex;
          justify-content: space-between;
          align-items: flex-end;
          border-top: 1px solid rgba(26, 60, 52, 0.15);
          padding-top: 24px;
      }
      .author {
          font-size: 16px;
          color: #1A3C34;
          font-weight: 700;
      }
      .date {
          font-size: 14px;
          color: #3E504B;
      }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="shape-1"></div>
        <div class="shape-2"></div>
        
        <div class="header">
            <div class="badge">Rapport Technique & Candidature</div>
            <h1>Sentinel AI : L'Intelligence Artificielle Autonome et Auto-Évolutive</h1>
            <p class="subtitle">Démontrer la souveraineté, la résilience et l'immunité active des systèmes logiciels par le triptyque Ouroboros.</p>
        </div>

        <div class="footer-info">
            <div class="author">
                <i class="fas fa-shield-alt" style="color: #D96C06; margin-right: 8px;"></i> Projet Sentinel AI (Sobka Simplice / Ingénierie Cloud)
            </div>
            <div class="date">
                Août 2026
            </div>
        </div>
    </div>
</body>
</html>
