name: 🧪 Validation CI Sentinel

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-suite:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: 📥 Restauration du Noyau
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Installation des dépendances cyber
        run: pip install requests loguru pytest -q

      - name: 🚀 Exécution des Tests
        run: pytest
