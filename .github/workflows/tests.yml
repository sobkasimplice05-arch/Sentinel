name: Sentinel CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install critical packages
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Pure Syntax Compilation Check
      run: |
        echo "🌀 SÉCURITÉ : Vérification de la viabilité technique uniquement..."
        python3 -m py_compile src/core/self_audit.py
        echo "✅ Le code compile. Carte blanche totale accordée à l'Ouroboros."
