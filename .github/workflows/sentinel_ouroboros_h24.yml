name: 🌐 Noyau d'évolution autonome Sentinelle

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  packages: write
  statuses: write

jobs:
  run-sentinel:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Restauration du Noyau
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Installation des dépendances cyber
        run: pip install requests loguru -q

      - name: 🚀 Exécution de l'auto-audit
        run: python self_audit.py
