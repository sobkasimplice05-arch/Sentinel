name: Évolution autonome du Sentinel H24

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  evolve:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Recursive Singularity Cycle
      env:
        # PANTHEON COMPLET DE VOS CLÉS SECRÈTES CONNECTÉES AU CLOUD
        SENTINEL_DISCORD_WEBHOOK: ${{ secrets.SENTINEL_DISCORD_WEBHOOK }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        HF_API_KEY: ${{ secrets.HF_API_KEY }}
        REPLICATE_API_KEY: ${{ secrets.REPLICATE_API_KEY }}
        PYTHONPATH: .
      run: |
        python3 src/core/self_audit.py
