name: Sentinel H24 Autonomous Evolution

on:
  schedule:
    - cron: '0 * * * *' # S'exécute TOUTES LES HEURES, 24h/24, 7j/7 sans s'arrêter
  workflow_dispatch:

jobs:
  evolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install Dependencies
        run: pip install requests pydantic httpx pytest loguru
          
      - name: Run Cloud Self-Audit & Evolution
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          REPLICATE_API_KEY: ${{ secrets.REPLICATE_API_KEY }}
          SENTINEL_DISCORD_WEBHOOK: ${{ secrets.SENTINEL_DISCORD_WEBHOOK }}
        run: |
          export PYTHONPATH=.
          python3 src/core/self_audit.py
          
      - name: Deploy Autonomous Code to GitHub
        run: |
          git config --global user.name "Sentinel-Bot"
          git config --global user.email "sentinel@ouroboros.ai"
          git add .
          git diff-index --quiet HEAD || git commit -m "feat(ouroboros): autonomous cloud evolution - H24 Ouroboros mutation"
          git push origin main || echo "Pas de modification ou conflit temporaire résolu."
