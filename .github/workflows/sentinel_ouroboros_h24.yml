name: 🌐 Noyau d'évolution autonome Sentinelle

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sentinel-feedback-main
  cancel-in-progress: false

jobs:
  run-sentinel:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      HF_API_KEY: ${{ secrets.HF_API_KEY }}
      SELF_MODIFICATION_ENABLED: "true"
      SELF_MODIFICATION_JSON_MODE: "true"
      SELF_MODIFICATION_MAX_TARGETS_PER_CYCLE: "1"
      SELF_MODIFICATION_PROVIDER: ${{ vars.SELF_MODIFICATION_PROVIDER || 'auto' }}
      SELF_MODIFICATION_MODEL_URL: ${{ secrets.SELF_MODIFICATION_MODEL_URL }}
      SELF_MODIFICATION_MODEL: ${{ vars.SELF_MODIFICATION_MODEL }}
      MODEL_API_URL: ${{ secrets.MODEL_API_URL }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      REPLICATE_API_KEY: ${{ secrets.REPLICATE_API_KEY }}
      GOOGLE_MODEL: ${{ vars.GOOGLE_MODEL || 'gemini-3.5-flash' }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      REPLICATE_MODEL: ${{ vars.REPLICATE_MODEL }}
      REPLICATE_MODEL_VERSION: ${{ secrets.REPLICATE_MODEL_VERSION }}
      OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'qwen2.5-coder:7b' }}
    steps:
      - name: 📥 Restauration du Noyau
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Installation des dépendances cyber
        run: pip install requests loguru pytest -q

      - name: 🧪 Validation des moteurs autonomie, agent général et feedback
        run: python -m py_compile agent_general_kernel.py autonomy_kernel.py feedback_learning.py learning_engine.py self_modification.py sentinel_v3_core.py tests/test_agent_general_kernel.py tests/test_autonomy_kernel.py tests/test_feedback_learning.py tests/test_self_modification.py

      - name: 🚀 Exécution du cycle d'apprentissage vérifiable
        run: python sentinel_v3_core.py

      - name: 📊 Publication des preuves du cycle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-feedback-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            feedback_report.json
            sentinel_learning_state.json
            sentinel_autonomy_report.json
            sentinel_autonomy_state.json
            agent_general_report.json
            agent_general_state.json
            self_modification_report.json
            sentinel_memory.db
