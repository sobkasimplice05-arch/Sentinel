name: 🔥 Brutal Singularity - Autonomous Evolution

on:
  schedule:
    # Toutes les heures
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  singularity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      workflows: write
    
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.ai/install.sh | sh
          nohup ollama serve > ollama.log 2>&1 &
          sleep 3
          ollama pull qwen2.5:1.5b
      
      - name: 🔥 ACTIVATE BRUTAL SINGULARITY
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          REPLICATE_API_KEY: ${{ secrets.REPLICATE_API_KEY }}
          SENTINEL_DISCORD_WEBHOOK: ${{ secrets.SENTINEL_DISCORD_WEBHOOK }}
        run: |
          pip install requests loguru -q
          export PYTHONPATH=.
          python3 src/core/self_audit.py
      
      - name: 📤 Force Push Evolution
        run: |
          git config user.email "sentinel-singularity@ouroboros.ai"
          git config user.name "Sentinel-Ouroboros"
          git add .
          git commit -m "🔥 BRUTAL MUTATION: Autonomous self-evolution cycle $(date +%s)" || true
          git push origin main --force
