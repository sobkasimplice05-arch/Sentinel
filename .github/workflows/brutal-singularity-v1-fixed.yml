name: 🔥 Brutal Singularity - Level 1 (Self-Healing)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

env:
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  HF_API_KEY: ${{ secrets.HF_API_KEY }}
  REPLICATE_API_KEY: ${{ secrets.REPLICATE_API_KEY }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

jobs:
  singularity-self-healing:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests loguru asyncio -q

      - name: 🦙 Setup Ollama (Clean Start)
        run: |
          # Nettoyage propre
          rm -rf /home/runner/.ollama 2>/dev/null || true
          pkill ollama 2>/dev/null || true
          
          # Install fresh
          curl -fsSL https://ollama.ai/install.sh | sh
          
          # Lanc en background
          nohup ollama serve > ollama.log 2>&1 &
          sleep 3
          
          # Pull model
          ollama pull qwen2.5:1.5b || echo "⚠️ Model pull failed, using cache"

      - name: 🔥 ACTIVATE WITH SELF-HEALING
        run: |
          export PYTHONPATH=.
          python3 << 'PYTHON'
import sys
import os
sys.path.insert(0, '/workspaces/Sentinel')

from src.core.self_healing import SelfHealing
from src.core.self_audit import BrutalSingularityCore
from src.core.mutation_reporter import MutationReporter
from src.core.discord_webhook import DiscordWebhook

print("\n" + "="*60)
print("🔥 LEVEL 1 WITH SELF-HEALING")
print("="*60)

healing = SelfHealing()
core = BrutalSingularityCore()
reporter = MutationReporter()
discord = DiscordWebhook()

try:
    # Tente l'évolution normale
    core.run_autonomous_cycle()
    
    # Si succès
    print("✅ Mutation successful")
    
except Exception as e:
    error_type = type(e).__name__
    error_msg = str(e)
    
    print(f"❌ Error detected: {error_type}")
    print(f"   Message: {error_msg}")
    
    # SELF-HEALING!
    print("🔧 Applying self-healing...")
    
    if "ssh" in error_msg.lower():
        success = healing.fix_ssh_conflict(error_msg)
    elif "timeout" in error_msg.lower():
        success = healing.fix_api_timeout(error_msg)
    elif "auth" in error_msg.lower() or "401" in error_msg or "403" in error_msg:
        success = healing.fix_api_auth_failed(error_msg)
    elif "ollama" in error_msg.lower():
        success = healing.fix_ollama(error_msg)
    elif "SyntaxError" in error_type:
        success = healing.fix_syntax_error(error_msg)
    elif "memory" in error_msg.lower():
        success = healing.fix_memory(error_msg)
    else:
        print(f"⚠️ Unknown error, logging for analysis")
        success = False
    
    # Log la solution
    healing.log_solution(error_type, success)
    
    # Envoie à Discord que SENTINEL s'est auto-corrigée
    if success:
        discord.send_error_report(
            cycle_num=0,
            error_msg=f"Self-healed: {error_type}",
            error_type="AUTO_CORRECTED"
        )
    else:
        discord.send_error_report(
            cycle_num=0,
            error_msg=error_msg,
            error_type=error_type
        )

print("="*60 + "\n")
PYTHON

      - name: 📤 Push Changes
        run: |
          git config user.email "sentinel-self-healing@ouroboros.ai"
          git config user.name "Sentinel-Self-Healing"
          git add -A
          git commit -m "🔧 SELF-HEALING: Auto-corrected errors" || true
          git push origin main --force

