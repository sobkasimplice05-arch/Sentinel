name: 🔥 Brutal Singularity - Level 4 (Aggressive Mutations)

on:
  schedule:
    - cron: '*/10 * * * *'  # Toutes les 10 min (6x par heure!)
  workflow_dispatch:

env:
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}

jobs:
  singularity-level-4:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install
        run: |
          pip install requests loguru -q
          curl -fsSL https://ollama.ai/install.sh | sh
          nohup ollama serve > ollama.log 2>&1 &
          sleep 2
          ollama pull qwen2.5:1.5b

      - name: 🔥 LEVEL 4: AGGRESSIVE MUTATIONS (1000+ lines)
        run: |
          export PYTHONPATH=.
          python3 << 'PYTHON'
import sys
sys.path.insert(0, '/workspaces/Sentinel')
from src.core.aggressive_mutations import AggressiveMutationEngine
import os

print("\n" + "="*60)
print("💥 LEVEL 4: AGGRESSIVE MUTATIONS")
print("Generating 1000+ line mutations...")
print("="*60)

engine = AggressiveMutationEngine()

with open("src/core/self_audit.py", "r") as f:
    code = f.read()

mutation = engine.generate_aggressive_mutation(code)

if mutation and len(mutation) > 1000:
    with open("src/core/self_audit.py", "w") as f:
        f.write(mutation)
    print("✅ AGGRESSIVE MUTATION APPLIED!")
    print(f"   Size: {len(mutation)} bytes")
else:
    print("⚠️ Mutation too small or failed")

print("="*60 + "\n")
PYTHON

      - name: 📤 Push Level 4
        run: |
          git config user.email "sentinel-level4@ouroboros.ai"
          git config user.name "Sentinel-Ouroboros-L4"
          git add -A
          git commit -m "💥 LEVEL 4: Aggressive mutation (1000+ lines)" || true
          git push origin main --force

