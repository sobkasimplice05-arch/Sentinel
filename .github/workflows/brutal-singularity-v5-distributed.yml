name: 🔥 Brutal Singularity - Level 5 (Distributed 3-Node)

on:
  schedule:
    - cron: '*/5 * * * *'  # Toutes les 5 min (12x par heure!)
  workflow_dispatch:

env:
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
  HF_API_KEY: ${{ secrets.HF_API_KEY }}

jobs:
  singularity-node-1:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install
        run: pip install requests loguru -q && curl -fsSL https://ollama.ai/install.sh | sh && nohup ollama serve > ollama.log 2>&1 & sleep 2 && ollama pull qwen2.5:1.5b
      - name: 🔥 NODE 1: Generate mutation
        run: |
          export PYTHONPATH=. NODE_ID=1
          python3 src/core/self_audit.py
      - name: Save mutation
        run: git add src/core/self_audit.py && git commit -m "🌐 NODE1: mutation cycle" || true

  singularity-node-2:
    runs-on: ubuntu-latest
    needs: singularity-node-1
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install
        run: pip install requests loguru -q && curl -fsSL https://ollama.ai/install.sh | sh && nohup ollama serve > ollama.log 2>&1 & sleep 2 && ollama pull qwen2.5:1.5b
      - name: 🔥 NODE 2: Generate mutation
        run: |
          export PYTHONPATH=. NODE_ID=2
          python3 src/core/self_audit.py
      - name: Save mutation
        run: git pull && git add src/core/self_audit.py && git commit -m "🌐 NODE2: mutation cycle" || true

  singularity-node-3:
    runs-on: ubuntu-latest
    needs: singularity-node-2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install
        run: pip install requests loguru -q && curl -fsSL https://ollama.ai/install.sh | sh && nohup ollama serve > ollama.log 2>&1 & sleep 2 && ollama pull qwen2.5:1.5b
      - name: 🔥 NODE 3: Generate mutation
        run: |
          export PYTHONPATH=. NODE_ID=3
          python3 src/core/self_audit.py
      - name: Push all mutations
        run: |
          git config user.email "sentinel-distributed@ouroboros.ai"
          git config user.name "Sentinel-Distributed"
          git pull
          git add -A
          git commit -m "🌐 LEVEL 5: Distributed 3-node evolution cycle" || true
          git push origin main --force

