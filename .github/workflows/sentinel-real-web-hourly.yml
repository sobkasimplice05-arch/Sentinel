name: Worker Rapide Sentinelle v3.0

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  real-web-singularity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Restauration du Noyau
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installation des dépendances cyber
        run: pip install requests loguru pytest -q

      - name: Exécution du Cœur Distribué v3.0
        run: python sentinel_v3_core.py
