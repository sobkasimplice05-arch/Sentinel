name: 🌐 Sentinel Real Web Learning (Hourly)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  real-web-learning:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests loguru -q

      - name: 🌐 SENTINEL LEARNS FROM REAL WEB
        run: |
          export PYTHONPATH=.
          python3 src/workflows/sentinel_learning_cycle.py

      - name: 📤 Commit discoveries
        if: success()
        run: |
          git config user.email "sentinel-web@learner.ai"
          git config user.name "Sentinel-RealWebLearner"
          git add sentinel_web_discoveries.json 2>/dev/null || true
          git commit -m "🌐 SENTINEL: Web learning cycle" || true
          git push origin main --force

