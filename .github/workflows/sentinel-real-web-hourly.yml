name: 🌐 Worker Rapide Sentinelle v3.0

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sentinel-feedback-main
  cancel-in-progress: false

jobs:
  real-web-singularity:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      HF_API_KEY: ${{ secrets.HF_API_KEY }}
    steps:
      - name: 📥 Restauration du Noyau
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Installation des dépendances cyber
        run: pip install requests loguru pytest -q

      - name: 🧪 Validation du moteur feedback
        run: python -m py_compile feedback_learning.py learning_engine.py sentinel_v3_core.py tests/test_feedback_learning.py

      - name: ⚡ Exécution du cycle d'apprentissage vérifiable
        run: python sentinel_v3_core.py

      - name: 📊 Publication des preuves du cycle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-feedback-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            feedback_report.json
            sentinel_learning_state.json
            sentinel_memory.db
